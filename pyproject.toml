[tool.poetry]
name = "ghtopdep"
version = "0.5.0"
description = "CLI tool for sorting dependents repositories and packages by stars"
authors = ["Andriy Orehov <andriyorehov@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.urls]
"Source" = "https://github.com/andriyor/ghtopdep"
"Bug Tracker" = "https://github.com/andriyor/ghtopdep/issues"

[tool.poetry.dependencies]
python = ">=3.10,<3.16"
selectolax = "^1.0.2"
tabulate = "^0.10.0"
click = "^8.5.0"
requests = "^2.34.2"
"github3.py" = "^4.0.1"
appdirs = "^1.4.4"
cachecontrol = {extras = ["filecache"], version = "^0.14.4"}
tqdm = "^4.70.1"

[tool.poetry.dev-dependencies]
better_exceptions = "^0.3.3"
pysnooper = "^1.2.3"

[tool.poetry.scripts]
ghtopdep = 'ghtopdep.ghtopdep:cli'
[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.dephell.main]
from = {format = "poetry", path = "pyproject.toml"}
to = {format = "setuppy", path = "setup.py"}
