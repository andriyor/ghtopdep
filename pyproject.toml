[project]
name = "ghtopdep"
version = "0.8.1"
description = "CLI tool for sorting dependents repositories and packages by stars"
authors = [{ name = "Andriy Orehov", email = "andriyorehov@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "selectolax>=1.0.2,<2",
    "tabulate>=0.10.0,<0.11",
    "click>=8.5.0,<9",
    "requests>=2.34.2,<3",
    "github3.py>=4.0.1,<5",
    "appdirs>=1.4.4,<2",
    "cachecontrol[filecache]>=0.14.4,<0.15",
    "tqdm>=4.70.1,<5",
]

[project.urls]
Source = "https://github.com/andriyor/ghtopdep"
"Bug Tracker" = "https://github.com/andriyor/ghtopdep/issues"

[project.scripts]
ghtopdep = "ghtopdep.ghtopdep:cli"

[dependency-groups]
dev = [
    "better-exceptions>=0.3.3,<0.4",
    "pysnooper>=1.2.3,<2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
